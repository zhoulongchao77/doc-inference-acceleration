<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<title>作者卡片 Demo</title>
<link href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --paper:#eceff3; --card:#ffffff; --ink:#16233a; --ink-soft:#3c4d66; --muted:#697a92;
  --line:#d7dee8; --line-soft:#e7ecf2;
  --navy:#1e3a5f; --navy-2:#2b527e; --blue:#2f6fb0; --blue-soft:#e7eff9;
  --accent:#e8590c; --accent-2:#d7541a; --accent-soft:#fdeee2;
  --teal:#0d9488; --teal-soft:#e2f1ef;
  --gold:#b9832b; --gold-soft:#f7efdd;
  --shadow:0 1px 2px rgba(22,35,58,.05),0 8px 24px -12px rgba(22,35,58,.18);
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);padding:40px 30px;
  background-image:linear-gradient(var(--line-soft) 1px,transparent 1px),linear-gradient(90deg,var(--line-soft) 1px,transparent 1px);
  background-size:34px 34px}
h1.demo{font-size:22px;font-weight:900;margin-bottom:6px}
p.demo{color:var(--muted);font-size:13px;margin-bottom:30px}
.row{display:flex;flex-direction:column;gap:18px}
.opt{display:flex;flex-direction:column;gap:8px}
.opt .no{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--accent)}
.card{border-radius:12px;padding:14px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;align-items:center;text-align:center}

/* A: 当前款 深藏青 */
.a{background:var(--navy);color:#fff}
.a .avatar{width:60px;height:60px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900}
.a .a-name{font-size:18px;font-weight:900;margin-top:10px}
.a .a-tag{font-size:12px;color:#ffd9bd;margin-top:3px;font-weight:500}
.a .a-role{margin-top:12px;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:#9fb4cd;border-top:1px solid rgba(255,255,255,.18);padding-top:10px;width:100%}

/* B: 白卡 + 橙色左边条 + 徽章 */
.b{background:#fff;align-items:flex-start;text-align:left;position:relative;border:1px solid var(--line);border-left:5px solid var(--accent)}
.b .badge{position:absolute;top:12px;right:12px;background:var(--accent);color:#fff;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;padding:3px 8px;border-radius:4px;font-weight:700}
.b .avatar{width:52px;height:52px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900}
.b .a-name{font-size:19px;font-weight:900;margin-top:12px}
.b .a-tag{font-size:12px;color:var(--muted);margin-top:3px}
.b .a-role{margin-top:12px;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--accent);font-weight:700}

/* C: 渐变深色 + 金色缎带角标 */
.c{background:linear-gradient(150deg,var(--navy) 0%,var(--navy-2) 60%,#3568a3 100%);color:#fff;position:relative;overflow:hidden}
.c .ribbon{position:absolute;top:14px;right:-32px;transform:rotate(38deg);background:var(--gold);color:#fff;font-size:10px;font-weight:700;letter-spacing:.1em;padding:3px 36px;font-family:var(--mono)}
.c .avatar{width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:#ffe9c4}
.c .a-name{font-size:18px;font-weight:900;margin-top:10px}
.c .a-tag{font-size:12px;color:#ffe9c4;margin-top:3px}
.c .a-role{margin-top:12px;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:#b9c9dd;border-top:1px solid rgba(255,255,255,.2);padding-top:10px;width:100%}

/* D: 极简白卡 大字 */
.d{background:#fff;border:1px solid var(--line);align-items:flex-start;text-align:left}
.d .sq{width:12px;height:12px;background:var(--accent);border-radius:3px}
.d .a-name{font-size:24px;font-weight:900;margin-top:14px;letter-spacing:.02em}
.d .a-tag{font-size:12.5px;color:var(--ink-soft);margin-top:5px}
.d .a-role{margin-top:14px;font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;color:var(--muted)}
.d .a-role b{color:var(--accent)}

/* E: 橙色渐变 + 网格纹理 */
.e{background:linear-gradient(140deg,var(--accent) 0%,var(--accent-2) 55%,#c2410c 100%);color:#fff;position:relative;overflow:hidden}
.e::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);background-size:18px 18px}
.e>*{position:relative}
.e .avatar{width:58px;height:58px;border-radius:50%;background:#fff;color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:900}
.e .a-name{font-size:18px;font-weight:900;margin-top:10px}
.e .a-tag{font-size:12px;color:#ffe3d1;margin-top:3px}
.e .chip{margin-top:12px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);font-family:var(--mono);font-size:10px;letter-spacing:.14em;padding:4px 12px;border-radius:20px;font-weight:600}

/* F: 纸张风 + 红印章 */
.f{background:#fbf9f4;border:1px solid #e5ddcb;align-items:flex-start;text-align:left;position:relative}
.f::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:repeating-linear-gradient(#c0392b 0 6px,#fbf9f4 6px 12px)}
.f .a-name{font-size:20px;font-weight:900;margin-top:2px}
.f .a-tag{font-size:12px;color:#8a7f63;margin-top:4px}
.f .seal{position:absolute;right:14px;top:14px;width:40px;height:40px;background:#c0392b;color:#fff;border-radius:6px;
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;line-height:1.15;
  transform:rotate(-8deg);box-shadow:0 2px 6px rgba(192,57,43,.35);text-align:center}
.f .a-role{margin-top:14px;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:#a3987d}
</style>
</head>
<body>
<h1 class="demo">作者卡片设计稿</h1>
<p class="demo">A 为当前线上版本（对照），其余为候选。</p>
<div class="row">

<div class="opt"><div class="no">A · 当前款</div>
<div class="card a">
<div class="avatar">周</div>
<div class="a-name">周龙超</div>
<div class="a-tag">超周到的程序员</div>
<div class="a-role">AUTHOR · 作者</div>
</div></div>

<div class="opt"><div class="no">B · 白卡橙条 + 徽章</div>
<div class="card b">
<div class="badge">AUTHOR</div>
<div class="avatar">周</div>
<div class="a-name">周龙超</div>
<div class="a-tag">超周到的程序员</div>
<div class="a-role">@zhoulongchao77</div>
</div></div>

<div class="opt"><div class="no">C · 深蓝渐变 + 金色缎带</div>
<div class="card c">
<div class="ribbon">AUTHOR</div>
<div class="avatar">周</div>
<div class="a-name">周龙超</div>
<div class="a-tag">超周到的程序员</div>
<div class="a-role">AI INFRA · 推理加速</div>
</div></div>

<div class="opt"><div class="no">D · 极简大字</div>
<div class="card d">
<div class="sq"></div>
<div class="a-name">周龙超</div>
<div class="a-tag">超周到的程序员</div>
<div class="a-role"><b>AUTHOR</b> · 作者</div>
</div></div>

<div class="opt"><div class="no">E · 橙色渐变网格</div>
<div class="card e">
<div class="avatar">周</div>
<div class="a-name">周龙超</div>
<div class="a-tag">超周到的程序员</div>
<div class="chip">AUTHOR · 作者</div>
</div></div>

<div class="opt"><div class="no">F · 纸张 + 红印章</div>
<div class="card f">
<div class="seal">作者</div>
<div class="a-name">周龙超</div>
<div class="a-tag">超周到的程序员</div>
<div class="a-role">AUTHOR · ZHOU LONGCHAO</div>
</div></div>

</div>
</body>
</html>
